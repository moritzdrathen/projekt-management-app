spring.application.name=projekt-management

# H2-Datenbank (dateibasiert, damit Daten beim Neustart erhalten bleiben)
spring.datasource.url=jdbc:h2:file:./data/pmdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2-Konsole für Entwicklung (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT-Konfiguration
app.jwt.secret=meinSehrGeheimerSchluesselFuerJWTDerMindestens256BitLangSeinMuss1234567890
app.jwt.expiration=86400000

server.port=8080
